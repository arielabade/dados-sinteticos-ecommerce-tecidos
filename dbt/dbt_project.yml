name: tecidos
version: "1.0.0"
config-version: 2
profile: tecidos

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages, logs]

vars:
  # Store time zone. MySQL has no time zone tables loaded, so we use a fixed offset
  # (Brazil has had no daylight saving time since 2019).
  utc_offset_horas: -3

models:
  tecidos:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
