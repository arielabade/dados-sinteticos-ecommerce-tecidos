version: 2

models:
  - name: stg_eventos
    description: >
      Events deduplicated (event_id and transaction_id) and with the time zone fixed.
      The uniqueness of evento_id and event_id is guaranteed by how the model is built
      (one MIN(evento_id) per event_id); testing it would require sorting ~15 million
      rows on disk, so there is no unique test here.
    columns:
      - name: evento_id
        tests: [not_null]
  - name: stg_clientes
    columns:
      - name: cliente_id
        tests: [unique, not_null]
      - name: email
        tests: [unique]
  - name: stg_pedidos
    columns:
      - name: pedido_id
        tests: [unique, not_null]
      - name: sessao_id
        tests:
          - relationships: {to: ref('stg_sessoes'), field: sessao_id}
