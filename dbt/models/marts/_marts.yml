version: 2

models:
  - name: fct_pedidos
    description: One real order (no tests) per row, with the customer's order sequence, cohort, margin and last-click channel.
    columns:
      - name: pedido_id
        tests: [unique, not_null]
      - name: cliente_id
        tests:
          - relationships: {to: ref('stg_clientes'), field: cliente_id}
      - name: status
        tests:
          - accepted_values: {values: ['aguardando_pagamento','pago','enviado','entregue','cancelado','devolvido']}
  - name: dim_clientes
    description: Unified customer (duplicate accounts with the same CPF merged).
    columns:
      - name: cliente_id
        tests: [unique, not_null]
  - name: fct_midia_diaria
    description: Spend next to reported and attributed conversions, by day and campaign.
    tests:
      - dbt_utils_like_unique_combination:
          columns: [data, plataforma, campanha_id]
  - name: fct_kpis_diarios
    columns:
      - name: data
        tests: [unique, not_null]
  - name: fct_funil_canal_diario
    description: GA4 funnel (sessions per step) by day, channel and device.
